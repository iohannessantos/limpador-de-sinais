<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpador de Sinais</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(270deg, #0f0c29, #302b63, #24243e);
            background-size: 600% 600%;
            color: white;
            text-shadow: 2px 2px 8px #000;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
        }
        input {
            width: 200px;
            text-align: center;
        }
        button {
            background-color: #ff4500;
            color: white;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.3s ease;
        }
        button:hover {
            background-color: #e03e00;
            transform: scale(1.05);
        }
        #result {
            margin-top: 30px;
            font-weight: bold;
            font-size: 22px;
            text-align: center;
            display: inline-block;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: #1e1e2f;
            color: #00ffcc;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>
<body>
    <h1>Limpador de Sinais</h1>

    <form method="POST">
        <input type="text" name="entrada" placeholder="Digite o CPF ou CEP">
        <button type="submit">Limpar</button>
    </form>

    <div id="result">
        {% if resultado %}
            {{ resultado }}
        {% endif %}
    </div>
</body>
</html>
